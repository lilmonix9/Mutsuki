name: build

# 每次 push 与 PR：
#   engine   编译 Godot + Voxel Tools（四个变体并行）。结果按 tools/engine.env 与 build-engine.sh 的哈希缓存，
#            版本不变时直接取缓存，几十秒完成。
#   build    测试 → 导出 Linux/Windows 便携版 → Linux 冒烟测试 → 软件渲染截图测试 → 上传产物与截图
#   smoke-windows   在 Windows 上无头启动导出版
#   double-precision  用双精度编辑器跑全部测试，断言双精度生效、带 Voxel Tools，并在 1000 km 处放置与拾取体素
on:
  push:
  pull_request:
  workflow_dispatch:

# 不取消进行中的运行：引擎编译很贵，半途取消就白跑了。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engine:
    name: 引擎 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-editor,        os: ubuntu-24.04 }
          - { name: linux-editor-double, os: ubuntu-24.04 }
          - { name: linux-template,      os: ubuntu-24.04 }
          - { name: windows-template,    os: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 查找已编译的引擎
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: engine-bin
          key: engine-${{ matrix.name }}-${{ hashFiles('tools/engine.env', 'tools/build-engine.sh') }}

      - name: 安装 SCons（Windows）
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        run: |
          source tools/engine.env
          python -m pip install "scons==$SCONS_VERSION"
          scons --version

      - name: 编译
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: tools/build-engine.sh ${{ matrix.name }} engine-bin

      - name: 缓存编译结果
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: engine-bin
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.name }}
          path: engine-bin/
          retention-days: 7
          if-no-files-found: error

  build:
    name: 测试与导出
    needs: engine
    runs-on: ubuntu-24.04
    env:
      ENGINE_DIR: ${{ github.workspace }}/.cache/engine
    steps:
      - uses: actions/checkout@v4

      - name: 下载自编译引擎
        uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: .cache/engine
          merge-multiple: true

      - name: 安装软件渲染环境（Xvfb + Mesa lavapipe）
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb mesa-vulkan-drivers
          dpkg-query -W xvfb mesa-vulkan-drivers

      - name: 准备引擎与导出模板
        run: tools/build.sh setup
      - name: 导入项目
        run: tools/build.sh import
      - name: 自动测试
        run: tools/build.sh test
      - name: 远坐标反向对照（单精度在 1000 km 处必须判错，证明测试足够灵敏）
        run: tools/far_test.sh "$ENGINE_DIR/godot.linuxbsd.editor.x86_64" single
      - name: 导出
        run: tools/build.sh export
      - name: 冒烟测试（Linux）
        run: tools/build.sh smoke
      - name: 软件渲染截图测试
        run: tools/build.sh render
      - name: 上传截图与差异图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            build/screenshots/
            build/screenshot-diff/
            build/render.log
          if-no-files-found: ignore

      - name: 上传 Linux 版
        uses: actions/upload-artifact@v4
        with:
          name: Mutsuki-linux-x86_64
          path: build/linux/
          if-no-files-found: error
      - name: 上传 Windows 版
        uses: actions/upload-artifact@v4
        with:
          name: Mutsuki-windows-x86_64
          path: build/windows/
          if-no-files-found: error

  smoke-windows:
    name: 冒烟测试（Windows）
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Mutsuki-windows-x86_64
          path: dist
      - name: 无头启动 Windows 版
        shell: bash
        # 用 console 包装程序启动，才能拿到标准输出。
        run: tools/smoke.sh dist/Mutsuki.console.exe

  double-precision:
    name: 双精度测试
    needs: engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-linux-editor-double
          path: .cache/engine-double
      - name: 用双精度编辑器跑全部测试
        run: |
          G=.cache/engine-double/godot.linuxbsd.editor.double.x86_64
          chmod +x "$G"
          "$G" --version
          "$G" --headless --path app --import
          "$G" --headless --path app -s res://tests/run_tests.gd -- --expect-double | tee double-tests.log
          # 双精度版本同样必须带 Voxel Tools
          grep -q "MUTSUKI_READY .*voxel=true precision=double" double-tests.log
      - name: 远坐标测试（双精度，距原点 1000 km 放置与拾取体素）
        run: tools/far_test.sh .cache/engine-double/godot.linuxbsd.editor.double.x86_64 double
